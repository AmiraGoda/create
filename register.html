<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body style=" background-color:#F6F8FF;">

    <div class="container mt-5 pt-5">
        <div class="row">

            <div class="md:col-6">
                <img src="img/56f58c5bbae6320e1aa5d36445fd722b.jpg" class="W-100">
            </div>

            <div class="md:col-6">
                <h2>Create Account</h2>
                <p class="text-muted mt-4 mb-6">Go ahead and sign up, let everyone <br>Know how awesome you are!</p>
                <h4 id="result"></h4>
                <form onsubmit="return validateData()" action="success.html" method="get">
                    <input id="user" type="text" name="user" class="form-control p-5 mb-10" placeholder="User Name">
                    <input id="email" type="text" name="email" class="form-control p-5 mb-10" placeholder="Email">
                    <input id="pass" type="password" name="pass" class="form-control p-5 mb-10" placeholder="Password">
                    <input id="confirm" type="password" name="confirm" class="form-control p-5 mb-10" placeholder="Confirm Password">
                    <input type="submit" value="Creat New Account" class="btn-solid theme-primary d-block w-100">
                </form>
            </div>

        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js "></script>
    <script src="js/all.min.js "></script>
    <script src="js/main.js "></script>
</body>

</html>
